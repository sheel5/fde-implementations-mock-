<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Report</title>
    <link rel="stylesheet" href="validation-report-display.css">
</head>
<body>
    <!-- Header Section -->
    <header class="app-header">
        <div class="header-content">
            <h1 class="app-title">Validation Report</h1>
            <p class="app-subtitle">AI Agent Cross-Validation Summary</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Loading State -->
        <div id="loadingState" class="empty-state">
            <p>Loading Report</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <p>No Report Available</p>
        </div>

        <!-- Rendered Markdown Report -->
        <div id="reportContainer" class="report-container" style="display: none;"></div>
    </main>

    <script src="validation-report-display.js"></script>
</body>
</html>
